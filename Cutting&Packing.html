<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            user-select: none;
        }
        body {
            background-color: #161309;
            color: #eae2cf;
            overscroll-behavior-y: contain;
        }
        .scanner-overlay {
            background: linear-gradient(0deg, rgba(255, 214, 0, 0.2) 0%, rgba(255, 214, 0, 0) 50%, rgba(255, 214, 0, 0.2) 100%);
            border: 2px solid #ffd600;
        }
        .scan-line {
            height: 2px;
            background: #ffd600;
            box-shadow: 0 0 15px #ffd600;
            animation: scan 2s linear infinite;
        }
        @keyframes scan {
            0% { top: 0%; }
            100% { top: 100%; }
        }
        .active-glow {
            box-shadow: 0 0 10px rgba(255, 214, 0, 0.3);
        }
    </style>
</head>
<body class="font-body-md text-body-md overflow-x-hidden">
<!-- Top Navigation -->
<header class="bg-surface dark:bg-surface text-primary dark:text-primary-fixed docked full-width top-0 border-b-2 border-outline flex justify-between items-center px-margin-mobile h-touch-target-min w-full z-50 sticky">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined cursor-pointer">menu</span>
<h1 class="font-display-id text-headline-lg-mobile uppercase text-primary-container tracking-tighter">MAXWELL FLOOR</h1>
</div>
<div class="flex items-center gap-4">
<div class="flex items-center gap-2 px-2 py-1 bg-status-success/10 rounded">
<span class="w-2 h-2 bg-status-success rounded-full animate-pulse"></span>
<span class="font-label-caps text-[10px] text-status-success">SYNCED</span>
</div>
<span class="material-symbols-outlined cursor-pointer hover:bg-surface-bright transition-colors p-2 rounded">sync</span>
</div>
</header>
<main class="flex flex-col min-h-[calc(100vh-72px-56px)] pb-32">
<!-- Scanning Viewport -->
<section class="w-full relative bg-black aspect-[4/3] flex items-center justify-center overflow-hidden">
<!-- Simulated Camera View -->
<div class="absolute inset-0 opacity-40 grayscale contrast-125" data-alt="A gritty high-contrast industrial warehouse background seen through a camera lens. The setting is dimly lit with harsh artificial yellow lighting, showing stacked fabric rolls on heavy metal racks. The visual style is raw, cinematic, and utilitarian, matching a rugged mobile device interface in a demanding work environment." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDlBAdSXb12BqXx5pmcfCayy9qeZBZH5iF0_eCBMXPILxbQglkXMErdKXIKUSWDEXA_6BiubL1s3fhkvLVyuJBhCBUOOzFOiTLWQSqdL7MZhIDYOHnstdHZje9huibcqiCO-V-alJz9v7c-_ZoIwFMoOEr3-pqQfUN9c4dl8MC_WGTe9i10JhJ2VGssoHs5vUxUTh4311M1_CSQeuFAdrC6f-3sdW_t_JrWIM-ozGFoa3XF8dkeNxfpGg')"></div>
<div class="scanner-overlay w-3/4 h-1/2 relative">
<div class="scan-line absolute w-full left-0"></div>
<!-- Corner Brackets -->
<div class="absolute top-0 left-0 w-8 h-8 border-t-4 border-l-4 border-primary-container"></div>
<div class="absolute top-0 right-0 w-8 h-8 border-t-4 border-r-4 border-primary-container"></div>
<div class="absolute bottom-0 left-0 w-8 h-8 border-b-4 border-l-4 border-primary-container"></div>
<div class="absolute bottom-0 right-0 w-8 h-8 border-b-4 border-r-4 border-primary-container"></div>
</div>
<!-- Scanning Indicator -->
<div class="absolute bottom-4 left-1/2 -translate-x-1/2 bg-surface-container-highest px-4 py-2 border border-outline flex items-center gap-2">
<span class="material-symbols-outlined text-primary-container animate-spin">barcode_scanner</span>
<span class="font-label-caps text-on-surface-variant">READY TO SCAN</span>
</div>
</section>
<!-- Status & Input Controls -->
<div class="px-margin-mobile -mt-6 relative z-10 space-y-4">
<!-- Parent Roll Status Card -->
<div class="bg-surface-container-high border-2 border-outline-variant p-4 flex flex-col gap-2">
<div class="flex justify-between items-start">
<div>
<span class="font-label-caps text-on-surface-variant">PARENT ROLL ID</span>
<h2 class="font-headline-md text-headline-md text-primary-container">R-99821-XL</h2>
</div>
<span class="bg-status-success text-on-secondary px-3 py-1 font-label-caps rounded-sm">ACTIVE</span>
</div>
<div class="grid grid-cols-2 gap-4 mt-2 border-t border-outline-variant pt-2">
<div>
<span class="font-label-caps text-[10px] text-on-surface-variant">MATERIAL</span>
<p class="font-body-md text-on-surface">HEAVY CANVAS - TAN</p>
</div>
<div class="text-right">
<span class="font-label-caps text-[10px] text-on-surface-variant">BALANCE</span>
<p class="font-headline-md text-headline-md text-status-success">142.5 M</p>
</div>
</div>
</div>
<!-- Input Form -->
<div class="space-y-4">
<div class="relative group">
<label class="absolute -top-3 left-3 px-1 bg-background text-primary-container font-label-caps text-[10px] z-10">CUT LENGTH (METERS)</label>
<div class="flex items-center">
<input class="w-full h-touch-target-min bg-surface border-2 border-outline focus:border-primary-container focus:ring-0 text-headline-lg font-headline-lg text-primary-fixed-dim px-4 appearance-none outline-none" placeholder="00.0" step="0.1" type="number"/>
<div class="flex flex-col h-touch-target-min border-y-2 border-r-2 border-outline">
<button class="flex-1 px-4 active:bg-surface-bright border-b border-outline flex items-center justify-center">
<span class="material-symbols-outlined">add</span>
</button>
<button class="flex-1 px-4 active:bg-surface-bright flex items-center justify-center">
<span class="material-symbols-outlined">remove</span>
</button>
</div>
</div>
</div>
<div class="grid grid-cols-2 gap-stack-gap">
<div class="relative">
<label class="absolute -top-3 left-3 px-1 bg-background text-on-surface-variant font-label-caps text-[10px] z-10">PARCEL ID (AUTO)</label>
<input class="w-full h-touch-target-min bg-surface-container-low border-2 border-outline-variant text-on-surface-variant font-headline-md px-4 opacity-70" disabled="" type="text" value="P-204431"/>
</div>
<div class="relative">
<label class="absolute -top-3 left-3 px-1 bg-background text-on-surface-variant font-label-caps text-[10px] z-10">OPERATOR</label>
<input class="w-full h-touch-target-min bg-surface-container-low border-2 border-outline-variant text-on-surface-variant font-headline-md px-4 opacity-70" disabled="" type="text" value="M.ROSSI"/>
</div>
</div>
</div>

<div class="flex items-center justify-between p-3 bg-surface-container-lowest border border-outline-variant">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-status-warning">history</span>
<span class="font-body-md text-on-surface-variant">Last Cut: <span class="text-on-surface font-bold">12.0M</span></span>
</div>
<button class="text-primary-container font-label-caps underline">VIEW QUEUE (3)</button>
</div>
</div>
</main>
<!-- Floating Action Bar (Contextual) -->
<div class="fixed bottom-[72px] left-0 w-full px-margin-mobile pb-margin-mobile z-40">
<button class="w-full h-[72px] bg-primary-container text-on-primary-container font-display-id text-headline-lg uppercase flex items-center justify-center gap-3 active:scale-[0.98] transition-transform shadow-xl border-4 border-black">
<span class="material-symbols-outlined font-bold text-3xl">print</span>
            PRINT STICKER
        </button>
</div>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 w-full h-[72px] flex justify-around items-stretch bg-surface-container-highest dark:bg-surface-container-highest border-t-2 border-outline z-50">
<a class="flex flex-col items-center justify-center text-on-surface-variant h-full w-full border-x border-outline-variant active:scale-95 duration-75 hover:bg-surface-bright" href="#">
<span class="material-symbols-outlined">barcode_scanner</span>
<span class="font-label-caps text-label-caps mt-1">ROLLS</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant h-full w-full border-x border-outline-variant active:scale-95 duration-75 hover:bg-surface-bright" href="#">
<span class="material-symbols-outlined">package_2</span>
<span class="font-label-caps text-label-caps mt-1">PARCELS</span>
</a>
<div class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container font-bold h-full w-full border-x border-outline active:scale-95 duration-75">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">content_cut</span>
<span class="font-label-caps text-label-caps mt-1">CUTTING</span>
</div>
<a class="flex flex-col items-center justify-center text-on-surface-variant h-full w-full border-x border-outline-variant active:scale-95 duration-75 hover:bg-surface-bright" href="#">
<span class="material-symbols-outlined">sync_problem</span>
<span class="font-label-caps text-label-caps mt-1">QUEUED</span>
</a>
</nav>
<script>
        // Micro-interaction for input field focus
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('active-glow');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('active-glow');
            });
        });

        // Simple button active state handler
        const primaryBtn = document.querySelector('button.bg-primary-container');
        primaryBtn.addEventListener('click', () => {
            primaryBtn.classList.add('bg-status-success');
            setTimeout(() => {
                primaryBtn.classList.remove('bg-status-success');
            }, 300);
        });
    </script>
</body></html>
